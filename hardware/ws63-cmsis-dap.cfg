# Static debug configuration; supply the matching OpenOCD Tcl tree with -s.
# Set PROBE_SERIAL before -f; optional ADAPTER_KHZ. See docs/hardware.md.
source [find interface/cmsis-dap.cfg]
if {![info exists PROBE_SERIAL] || $PROBE_SERIAL eq ""} {
    error "Set PROBE_SERIAL explicitly before loading this configuration"
}
adapter serial $PROBE_SERIAL
if {![info exists ADAPTER_KHZ]} { set ADAPTER_KHZ 1000 }
adapter speed $ADAPTER_KHZ
bindto 127.0.0.1
if {![info exists WS63_FLASH]} { set WS63_FLASH 0 }
source [find target/ws63.cfg]
